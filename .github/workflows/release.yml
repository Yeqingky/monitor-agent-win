name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked --target x86_64-pc-windows-gnu
      - run: cp target/x86_64-pc-windows-gnu/release/monitor-agent.exe monitor-agent-x86_64-pc-windows-gnu.exe
      - uses: actions/upload-artifact@v7
        with:
          name: x86_64-pc-windows-gnu
          path: monitor-agent-x86_64-pc-windows-gnu.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p bin && mv monitor-agent-* bin/
          (cd bin && sha256sum monitor-agent-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-agent-* bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
